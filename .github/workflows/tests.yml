name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/**

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
